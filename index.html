<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111919">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afternoon Pump">
  <meta name="description" content="Your private, guided strength and mobility workout tracker.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Afternoon Pump</title>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <div class="brand"><div class="brand-glyph" aria-hidden="true">↗</div><div><div class="brand-name">AFTERNOON<span>PUMP</span></div><div class="brand-subtitle">YOUR POCKET GYM COACH</div></div></div>
      <div class="brand-date" id="header-date"></div>
    </header>
    <main id="main" tabindex="-1" aria-live="off">
      <div class="loading">Getting your workout ready…</div>
    </main>
    <nav class="bottom-nav" aria-label="App navigation">
      <button class="nav-item active" data-tab="train" type="button" aria-label="Train"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6m3-9v12m12-12v12m3-9v6M6 12h12"/></svg><span>Train</span></button>
      <button class="nav-item" data-tab="history" type="button" aria-label="Workout history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M7 16l4-5 3 3 5-7"/></svg><span>History</span></button>
      <button class="nav-item" data-tab="settings" type="button" aria-label="Settings and backups"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span>Settings</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
